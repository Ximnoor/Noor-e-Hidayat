name: Build test APK

on:
  push:
    branches:
      - build/test-apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug signing key
        run: >
          keytool -genkeypair -v
          -keystore debug.keystore
          -storepass android
          -alias androiddebugkey
          -keypass android
          -dname "CN=Noor-e-Hidayat Test,O=Ximnoor,C=PK"
          -keyalg RSA
          -keysize 2048
          -validity 10000

      - name: Run tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Noor-e-Hidayat-v1.0-test.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-e-Hidayat-v1.0-test
          path: Noor-e-Hidayat-v1.0-test.apk
          if-no-files-found: error

      - name: Publish private GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-v1.0.0
          target_commitish: ${{ github.sha }}
          name: Noor-e-Hidayat v1.0 Test
          body: |
            First Android test build for owner testing.
            
            This APK uses a temporary debug signing key. It is for testing only and is not the final Google Play release.
          prerelease: true
          files: Noor-e-Hidayat-v1.0-test.apk
