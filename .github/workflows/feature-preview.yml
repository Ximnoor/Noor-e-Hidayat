name: Verify Islamic essentials
on:
  push:
    branches: [feature/islamic-essentials]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: essentials-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create isolated preview key
        run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Noor Preview' -keyalg RSA -keysize 2048 -validity 3650
      - name: Test and assemble preview
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/Noor-e-Hidayat-1.1-preview.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose preview/Noor-e-Hidayat-1.1-preview.apk
          cd preview
          sha256sum Noor-e-Hidayat-1.1-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Noor-e-Hidayat-1.1-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essentials-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/src/test/screenshots/
          retention-days: 7
